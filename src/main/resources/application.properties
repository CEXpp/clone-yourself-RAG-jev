# Load optional project-root .env as Java properties (relative to working directory).
spring.config.import=optional:file:.env[.properties]
server.address=127.0.0.1
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
app.data-dir=${DATA_DIR:./data}
app.demo-data=${DEMO_DATA:true}
app.import-file=
app.approve-public=false
app.jev-url=${JEV_URL:https://api.typesafe.ai/v1/systemone}
app.jev-key=${JEV_API_KEY:}
app.jev-model=${JEV_MODEL:jev-latest}
app.jev-threshold=${JEV_THRESHOLD:0.65}
app.generation-url=${GEN_URL:https://api.openai.com/v1/chat/completions}
app.generation-key=${GEN_API_KEY:}
app.generation-model=${GEN_MODEL:}
app.embedding-mode=${EMBEDDING_MODE:auto}
app.model-dir=${MODEL_DIR:models}
app.embedding-url=${EMBED_URL:https://api.openai.com/v1/embeddings}
app.embedding-key=${EMBED_API_KEY:}
app.embedding-model=${EMBED_MODEL:}
app.http-timeout-seconds=${HTTP_TIMEOUT_SECONDS:8}
app.lexical-coverage=${LEXICAL_COVERAGE:0.5}
app.vector-threshold=${VECTOR_THRESHOLD:}
app.index-dir=${INDEX_DIR:}
spring.jackson.deserialization.fail-on-unknown-properties=true
